<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patcher</title>
    <style>
        /* CRITICAL ARCHITECTURE: CSS Variables Skeleton */
        :root {
            --bg-main: #f4f5f7;
            --bg-panel: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
            --border-hover: #9ca3af;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --success-color: #16a34a;
            --warning-color: #ea580c; /* Dark orange/red for error visibility */
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--text-main);
        }

        /* Module Layout System */
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 1400px;
            flex-grow: 1;
            align-items: start;
        }

        .module {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        /* Action/Input Area */
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: center;
        }

        .file-info, .status-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
            min-height: 1.2rem;
        }

        /* Buttons */
        button, .download-btn {
            padding: 1rem;
            border: none;
            border-radius: var(--radius);
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover:not(:disabled), .download-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            color: var(--text-muted);
            box-shadow: none;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        /* Previews & Iframes */
        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .preview-container iframe {
            width: 200%;
            height: 200%;
            border: none;
            background-color: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
            transform: scale(0.5);
            transform-origin: top left;
        }

        .raw-preview {
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-all;
            overflow: hidden;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            background: var(--bg-panel);
        }

        /* Status List */
        .status-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: left;
            margin-top: 0.5rem;
        }

        .text-green { color: var(--success-color); }
        .text-red { color: var(--warning-color); }
        .text-gray { color: var(--text-muted); text-align: center; }

        /* Animations & Loaders */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        .skeleton {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e5e7eb;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-weight: bold;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        /* Modal Dialog */
        dialog {
            width: 90vw;
            max-width: 800px;
            height: 80vh;
            border: none;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem;
            background: var(--bg-main);
            flex-direction: column;
            gap: 1rem;
            z-index: 9999;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        dialog[open] {
            display: flex; /* Override default block display */
        }

        dialog textarea {
            width: 100%;
            flex-grow: 1;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            resize: none;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 { margin: 0; font-size: 1.5rem; }

        /* Responsive Layout - Mobile */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .module {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                align-items: start;
            }
            .preview-container {
                aspect-ratio: auto;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Patcher <span style="font-size: 0.5em; color: var(--text-muted); vertical-align: middle;">v0.0.4</span></h1>
    </header>

    <main class="container">
        <!-- Module 1: Input Zone -->
        <div class="module">
            <div class="action-area">
                <button id="upload-btn">Upload file</button>
                <input type="file" id="file-input" accept=".html,.js,.css,.txt" hidden>
                <div class="file-info" id="file-info">No file selected</div>
            </div>
            <div class="preview-container">
                <div class="skeleton" id="input-skeleton">Awaiting File...</div>
                <iframe id="input-preview" class="hidden" sandbox=""></iframe>
            </div>
        </div>

        <!-- Module 2: Engine Zone -->
        <div class="module">
            <div class="action-area">
                <button id="clipboard-btn">Input LLM markdown<br>from clipboard</button>
                <div class="status-list" id="status-list">
                    <div class="text-gray">✔️ no input</div>
                </div>
            </div>
            <div class="preview-container" id="raw-preview-container" title="Tap to manually edit">
                <div class="skeleton hidden" id="engine-skeleton"></div>
                <div class="raw-preview" id="raw-preview">Paste preview will appear here...</div>
            </div>
        </div>

        <!-- Module 3: Output Zone -->
        <div class="module">
            <div class="action-area">
                <a id="download-btn" class="download-btn hidden">Download patched file</a>
            </div>
            <div class="preview-container">
                <div class="skeleton" id="output-skeleton">Awaiting Patch...</div>
                <iframe id="output-preview" class="hidden" sandbox=""></iframe>
            </div>
        </div>
    </main>

    <!-- Fallback Text Editor Modal -->
    <dialog id="editor-modal">
        <div class="modal-header">
            <h2>Manual Input</h2>
            <button id="close-modal-btn" style="width: auto; padding: 0.5rem 1rem; background: var(--text-muted);">Close</button>
        </div>
        <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">Auto-paste blocked or unavailable. Please paste your LLM markdown below.</p>
        <textarea id="manual-input" placeholder="Paste AI instructions here..." spellcheck="false" maxlength="5000000"></textarea>
        <button id="apply-manual-btn">Apply Patches</button>
    </dialog>

    <script>
        // --- DOM Elements ---
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        
        const inputSkeleton = document.getElementById('input-skeleton');
        const inputPreview = document.getElementById('input-preview');
        
        const clipboardBtn = document.getElementById('clipboard-btn');
        const statusList = document.getElementById('status-list');
        const rawPreviewContainer = document.getElementById('raw-preview-container');
        const rawPreview = document.getElementById('raw-preview');
        
        const outputSkeleton = document.getElementById('output-skeleton');
        const outputPreview = document.getElementById('output-preview');
        const downloadBtn = document.getElementById('download-btn');

        const editorModal = document.getElementById('editor-modal');
        const manualInput = document.getElementById('manual-input');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const applyManualBtn = document.getElementById('apply-manual-btn');

        // --- State Management ---
        let sourceFileContent = "";
        let originalFileName = "";
        let originalFileExtension = "";
        let isProcessing = false;
        let pendingInstructions = "";
        let currentInstructions = "";
        let failedPatchesMap = {};

        // --- File Ingestion ---
        uploadBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            const parts = originalFileName.split('.');
            originalFileExtension = parts.length > 1 ? parts.pop() : '';
            
            uploadBtn.textContent = "Upload different file";
            fileInfo.textContent = originalFileName;
            
            // Show loading state
            inputPreview.classList.add('hidden');
            inputSkeleton.textContent = "Loading...";
            inputSkeleton.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = (e) => {
                sourceFileContent = e.target.result.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                
                // Render iframe preview with a slight artificial delay for smoothness
                setTimeout(() => {
                    inputPreview.srcdoc = sourceFileContent;
                    inputPreview.classList.remove('hidden');
                    inputSkeleton.classList.add('hidden');
                }, 300);

                // Reset outputs
                downloadBtn.classList.add('hidden');
                outputPreview.classList.add('hidden');
                outputSkeleton.textContent = "Awaiting Patch...";
                outputSkeleton.classList.remove('hidden');
                
                if (pendingInstructions) {
                    processInstructions(pendingInstructions);
                    pendingInstructions = "";
                } else {
                    statusList.innerHTML = '<div class="text-gray">✔️ ready for markdown</div>';
                    rawPreview.textContent = "Paste preview will appear here...";
                }
            };
            reader.readAsText(file);
        });

        // --- Modal Flow ---
        rawPreviewContainer.addEventListener('click', () => {
            editorModal.showModal();
        });
        
        closeModalBtn.addEventListener('click', () => {
            editorModal.close();
        });

        applyManualBtn.addEventListener('click', () => {
            const text = manualInput.value;
            editorModal.close();
            if (text.trim()) {
                processInstructions(text);
            }
        });

        // --- Error Link Routing ---
        statusList.addEventListener('click', (e) => {
            if (e.target.classList.contains('error-link')) {
                e.preventDefault();
                const patchId = e.target.getAttribute('data-patch');
                const findString = failedPatchesMap[patchId];
                if (findString && currentInstructions) {
                    manualInput.value = currentInstructions;
                    editorModal.showModal();
                    
                    const start = currentInstructions.indexOf(findString);
                    if (start !== -1) {
                        const end = start + findString.length;
                        manualInput.focus();
                        manualInput.setSelectionRange(start, end);
                    }
                }
            }
        });

        // --- Clipboard Flow (Option A) ---
        clipboardBtn.addEventListener('click', async () => {
            if (isProcessing) return;

            try {
                const text = await navigator.clipboard.readText();
                if (!text.trim()) {
                    statusList.innerHTML = '<div class="text-red">❗ Clipboard is empty</div>';
                    return;
                }
                
                if (!sourceFileContent) {
                    pendingInstructions = text;
                    currentInstructions = text;
                    rawPreview.textContent = text.substring(0, 500) + (text.length > 500 ? "..." : "");
                    statusList.innerHTML = '<div class="text-gray">✔️ Markdown ready. Awaiting file upload...</div>';
                } else {
                    processInstructions(text);
                }
            } catch (err) {
                // Fallback if clipboard API blocked
                statusList.innerHTML = '<div class="text-red">❗ Auto-paste blocked. Tap box below.</div>';
                editorModal.showModal();
            }
        });

        // --- Core Engine Logic ---
        function processInstructions(instructions) {
            isProcessing = true;
            currentInstructions = instructions;
            failedPatchesMap = {};
            
            // Update UI to Processing State
            rawPreview.textContent = instructions.substring(0, 500) + (instructions.length > 500 ? "..." : "");
            statusList.innerHTML = '<div class="text-gray"><div class="spinner"></div> Reading clipboard...</div>';
            
            setTimeout(() => {
                statusList.innerHTML = '<div class="text-gray"><div class="spinner"></div> Parsing AI instructions...</div>';
                
                setTimeout(() => {
                    executePatches(instructions);
                }, 400); // Artificial delay for effect
            }, 300);
        }

        function executePatches(instructions) {
            const normalizedInstructions = instructions.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const regex = /```[^\n]*\n([\s\S]*?)```/g;
            const blocks = [];
            let match;
            
            while ((match = regex.exec(normalizedInstructions)) !== null) {
                let blockContent = match[1];
                if (blockContent.endsWith('\n')) blockContent = blockContent.slice(0, -1);
                if (blockContent.endsWith('\r')) blockContent = blockContent.slice(0, -1);
                blocks.push(blockContent);
            }

            statusList.innerHTML = ''; // Clear status list

            if (blocks.length === 0) {
                statusList.innerHTML = '<div class="text-red">❗ No code blocks found</div>';
                isProcessing = false;
                return;
            }

            let patchedContent = sourceFileContent;
            let patchCount = 0;
            let successCount = 0;

            for (let i = 0; i < blocks.length - 1; i += 2) {
                const findString = blocks[i];
                const replaceString = blocks[i + 1];
                patchCount++;

                if (patchedContent.includes(findString)) {
                    patchedContent = patchedContent.replace(findString, replaceString);
                    statusList.innerHTML += `<div>✅ patch ${patchCount} applied</div>`;
                    successCount++;
                } else {
                    failedPatchesMap[patchCount] = findString;
                    statusList.innerHTML += `<a href="#" class="error-link text-red" data-patch="${patchCount}" style="display:block; text-decoration:none; margin-top:0.25rem;">❗ patch ${patchCount} not found (click to locate)</a>`;
                }
            }

            // Output Generation
            if (successCount > 0) {
                outputSkeleton.textContent = "Rendering...";
                
                setTimeout(() => {
                    outputPreview.srcdoc = patchedContent;
                    outputPreview.classList.remove('hidden');
                    outputSkeleton.classList.add('hidden');
                    
                    // Generate Download
                    const nameWithoutExt = originalFileName.substring(0, originalFileName.lastIndexOf('.')) || originalFileName;
                    const newFileName = `${nameWithoutExt}_patched.${originalFileExtension}`;
                    
                    const blob = new Blob([patchedContent], { type: 'text/plain' });
                    downloadBtn.href = URL.createObjectURL(blob);
                    downloadBtn.download = newFileName;
                    downloadBtn.classList.remove('hidden');
                }, 300);
            } else {
                outputSkeleton.textContent = "No changes applied.";
            }
            
            isProcessing = false;
        }
    </script>
</body>
</html>
